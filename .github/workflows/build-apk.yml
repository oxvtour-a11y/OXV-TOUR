name: Build OXV TOUR APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Capacitor project
        run: |
          mkdir www
          cp index.html www/index.html

          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.oxvtour.app",
            "appName": "OXV TOUR",
            "webDir": "www"
          }
          EOF

          npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OXV-TOUR-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
